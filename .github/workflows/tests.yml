name: Tests

# Validates every push and pull request. This is deliberately separate from
# pipeline.yml: test failures here should block merges via branch protection,
# independent of the scheduled data pipeline's own pre-commit test gate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  # Read-only: this workflow only validates code, it never writes to the repo.
  contents: read

concurrency:
  group: adip-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src scripts tests

      - name: Type check (mypy)
        run: mypy src
        continue-on-error: true # informational for now; see docs/architecture.md limitations

      - name: Run tests with coverage
        run: pytest -q --cov=src/adip --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14
