# ADIP city registry.
# Adding/removing a city here changes what the pipeline collects — no code changes needed.
# `id` must be a stable, lowercase, snake_case key: it is used as a primary key
# throughout storage and must never be renamed once data has been collected for it
# (renaming silently orphans historical rows).
cities:
